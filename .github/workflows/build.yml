name: Verify Open Mine APK

on:
  push:
    branches: [main, codex/operational-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-mine-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_COMMIT }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install build SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Record source and run shell verification
        run: |
          mkdir -p verification
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          git rev-parse HEAD > verification/source-commit.txt
          git status --porcelain --untracked-files=no > verification/source-status.txt
          test ! -s verification/source-status.txt
          bash -n app/src/main/assets/sandbox/morsllm.sh
          python3 app/src/test/scripts/test_engine_lifecycle.py 2>&1 | tee verification/python-tests.txt

      - name: Run final-source unit tests, lint, and build APKs
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Inspect the exact APK and record identity evidence
        run: |
          python3 scripts/verify_packaged_shell.py app/build/outputs/apk/debug/app-debug.apk | tee verification/packaged-shell.txt
          python3 scripts/inspect_apk.py app/build/outputs/apk/debug/app-debug.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0" --commit "$TESTED_COMMIT" --output verification

      - name: Enable hosted emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android runtime and integration checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run_android_checks.sh

      - name: Upload exact tested development APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Mine-development-${{ env.TESTED_COMMIT }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification/
            docs/INTEGRATION_ACCEPTANCE.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload complete test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Open-Mine-test-reports-${{ env.TESTED_COMMIT }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            verification/
          if-no-files-found: warn
          retention-days: 14
