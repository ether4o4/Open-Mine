name: Build Open Mine APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate installed Android SDK tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: '"$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile checks
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Mine-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned bundle and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: Open-Mine-bundle-and-reports
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/
